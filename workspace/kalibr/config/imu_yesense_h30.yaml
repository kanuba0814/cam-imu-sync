#
# Yesense H30 / H30WP / H30MINI IMU noise model for Kalibr
#
# Kalibr uses continuous-time noise densities (same units as datasheets).
#
# Datasheet values (original):
#   Gyroscope:
#     Noise density      = 0.005 deg/s/sqrt(Hz)  => 8.7266e-05 rad/s/sqrt(Hz)
#     Bias instability   = 4 deg/h               => 1.9393e-05 rad/s^1.5
#   Accelerometer:
#     Noise density      = 60 ug/sqrt(Hz)         => 5.8840e-04 m/s^2/sqrt(Hz)
#     Bias instability   = 35 uG                  => 3.4323e-04 m/s^2.5
#
# NOTE: Datasheet values x10 for Kalibr calibration.
#       Previous calibration with original values yielded normalized residuals
#       of gyro=6.35, accel=8.99 (ideal < 1.0), indicating the noise model
#       was too optimistic. Multiplying by 10x to better match real conditions.
#

# rostopic: /imu/data_raw
rostopic: /sync/imu
update_rate: 200.0 # Hz

accelerometer_noise_density: 5.8840e-03 # m/s^2/sqrt(Hz)  (datasheet 5.884e-04 x10)
accelerometer_random_walk: 3.4323e-03 # m/s^2.5          (datasheet 3.4323e-04 x10)

gyroscope_noise_density: 8.7266e-04 # rad/s/sqrt(Hz)   (datasheet 8.7266e-05 x10)
gyroscope_random_walk: 1.9393e-04 # rad/s^1.5        (datasheet 1.9393e-05 x10)
